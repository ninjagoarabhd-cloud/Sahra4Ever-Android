plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sahra4ever.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sahra4ever.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding = 'UTF-8'
    }

    // إعدادات Kotlin المطلوبة
    kotlinOptions {
        jvmTarget = '17'
    }

    // تفعيل Jetpack Compose
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
}

dependencies {
    // مكتبات Compose الأساسية
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'

    // التنقل بين الشاشات
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // الشبكة (Retrofit) لجلب بيانات TMDB
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // مكتبة Coil لعرض الصور بكفاءة
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // إدارة الحالة (ViewModel)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
}